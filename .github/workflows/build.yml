name: build

# test -> images -> deploy on every push to main; test + terraform checks on PRs.
# Azure auth is OIDC (federated credential on the gh-pdfrag-ci Entra app): no secrets in GitHub.
# That identity can only push images (AcrPush) and update the two container apps
# (Container Apps Contributor, scoped to each app). Infrastructure changes go through Terraform, run locally.
#
# Repo variables: AZURE_CLIENT_ID, AZURE_TENANT_ID, AZURE_SUBSCRIPTION_ID, ACR_NAME, RESOURCE_GROUP

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # OIDC token for azure/login

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
            frontend/requirements.txt
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest -q

  terraform:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infrastructure/terraform
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
      - run: terraform fmt -check -recursive
      - run: terraform init -backend=false -input=false
      - run: terraform validate

  images:
    needs: [test, terraform]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - image: pdf-rag-api
            context: .
          - image: pdf-rag-ui
            context: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Log in to ACR
        run: az acr login --name ${{ vars.ACR_NAME }}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          push: true
          tags: |
            ${{ vars.ACR_NAME }}.azurecr.io/${{ matrix.image }}:${{ github.sha }}
            ${{ vars.ACR_NAME }}.azurecr.io/${{ matrix.image }}:latest
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}

  deploy:
    needs: images
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    concurrency: deploy-dev # never run two rollouts at once
    env:
      RG: ${{ vars.RESOURCE_GROUP }}
      REGISTRY: ${{ vars.ACR_NAME }}.azurecr.io
    steps:
      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - run: az config set extension.use_dynamic_install=yes_without_prompt
      - name: Roll API, then UI
        run: |
          for app in api ui; do
            az containerapp update -n ca-pdfrag-$app -g "$RG" \
              --image "$REGISTRY/pdf-rag-$app:${{ github.sha }}" -o none
          done
      - name: Wait for healthy revisions
        run: |
          for app in api ui; do
            for i in $(seq 1 30); do
              out=$(az containerapp show -n ca-pdfrag-$app -g "$RG" -o tsv \
                --query "[properties.latestRevisionName, properties.latestReadyRevisionName, properties.template.containers[0].image]")
              # Here-string always ends in a newline, so `read` never hits EOF (fatal under bash -e).
              { read -r latest; read -r ready; read -r image; } <<< "$out"
              if [ "$latest" = "$ready" ] && [[ "$image" == *":${{ github.sha }}" ]]; then
                echo "ca-pdfrag-$app ready: $ready"; continue 2
              fi
              sleep 10
            done
            echo "::error::ca-pdfrag-$app revision $latest did not become ready"; exit 1
          done
